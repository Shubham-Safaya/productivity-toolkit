[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "productivity-toolkit"
version = "0.2.0"
description = "Seven CLI tools powered by the Claude API for career development, content creation, and financial planning"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.116.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
toolkit = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = [
    "toolkit",
    "linkedin_batch",
    "outreach_templates",
    "interview_prep",
    "eb1a_tracker",
    "medium_drafts",
    "financial_review",
    "content_repurpose",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
